# generated from system: edit there
# The GitHub Pages settings of a public pages repository, placed by the sync from `system`
# (library/repository-files/pages-config@public/_config.yml). Every machinery file stays out of the published site.
# Never add a `.nojekyll` file: it switches this list off and publishes every file.
exclude:
  - scripts/
  - AGENTS.md
  - CLAUDE.md
  - .agents/
  - .claude/
  - .pre-commit-config.yaml
  - .gitattributes
  - .gitignore
  - README.md
